name: Gerar APK Android

on:
  push:
    paths:
      - 'www/**'
      - 'res/**'
      - 'config.xml'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos do projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Cordova
        run: npm install --global cordova@13.0.0


      - name: Preparar projeto Android
        run: |
          cordova platform add android@15.0.0
          cordova plugin add cordova-plugin-file@8.1.3
          cordova plugin add cordova-plugin-x-socialsharing@6.0.4
          cordova plugin add cordova-plugin-advanced-http@3.3.1

      - name: Gerar APK para instalar no aparelho
        run: |
          cordova build android --debug
          mkdir -p saida
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk saida/Visita_Tecnica_EC.apk

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: APK-Visita-Tecnica-EC
          path: saida/Visita_Tecnica_EC.apk
          if-no-files-found: error
          retention-days: 30
