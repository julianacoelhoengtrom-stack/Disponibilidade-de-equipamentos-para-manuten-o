name: Gerar APK Android

on:
  push:
    paths:
      - 'www/**'
      - 'res/**'
      - 'config.xml'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os arquivos do projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Cordova
        run: npm install --global cordova@13.0.0

      - name: Gerar ícones Android a partir da caricatura
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 www/assets/mascote-tecnico.svg > res/icon.png
          rsvg-convert -w 36 -h 36 www/assets/mascote-tecnico.svg > res/icon/android/ldpi.png
          rsvg-convert -w 48 -h 48 www/assets/mascote-tecnico.svg > res/icon/android/mdpi.png
          rsvg-convert -w 72 -h 72 www/assets/mascote-tecnico.svg > res/icon/android/hdpi.png
          rsvg-convert -w 96 -h 96 www/assets/mascote-tecnico.svg > res/icon/android/xhdpi.png
          rsvg-convert -w 144 -h 144 www/assets/mascote-tecnico.svg > res/icon/android/xxhdpi.png
          rsvg-convert -w 192 -h 192 www/assets/mascote-tecnico.svg > res/icon/android/xxxhdpi.png

      - name: Preparar projeto Android
        run: |
          cordova platform add android@15.0.0
          cordova plugin add cordova-plugin-file@8.1.3
          cordova plugin add cordova-plugin-x-socialsharing@6.0.4
          cordova plugin add cordova-plugin-advanced-http@3.3.1

      - name: Gerar APK para instalar no aparelho
        run: |
          cordova build android --debug
          mkdir -p saida
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk saida/Visita_Tecnica_EC.apk

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: APK-Visita-Tecnica-EC
          path: saida/Visita_Tecnica_EC.apk
          if-no-files-found: error
          retention-days: 30
